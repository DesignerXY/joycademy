name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过进行中的运行
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖 (Install dependencies)
        run: npm ci

      - name: 构建全站多页面产物 (Build All-in-One MPA)
        run: npm run build

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物至 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 自动部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
